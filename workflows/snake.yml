name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animação da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pablosillva
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#fecdd3,#fda4af,#fb7185,#e11d48
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2563ebe&color_dots=#161b22,#4c0519,#9f1239,#e11d48,#fb7185

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
